ackground-color:transparent;}#mardu-diagram-2 .label text,#mardu-diagram-2 span{fill:#121212;color:#121212;}#mardu-diagram-2 .node rect,#mardu-diagram-2 .node circle,#mardu-diagram-2 .node ellipse,#mardu-diagram-2 .node polygon,#mardu-diagram-2 .node path{fill:#f4f4f4;stroke:#351b5a;stroke-width:1px;}#mardu-diagram-2 .rough-node .label text,#mardu-diagram-2 .node .label text,#mardu-diagram-2 .image-shape .label,#mardu-diagram-2 .icon-shape .label{text-anchor:middle;}#mardu-diagram-2 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mardu-diagram-2 .rough-node .label,#mardu-diagram-2 .node .label,#mardu-diagram-2 .image-shape .label,#mardu-diagram-2 .icon-shape .label{text-align:center;}#mardu-diagram-2 .node.clickable{cursor:pointer;}#mardu-diagram-2 .root .anchor path{fill:#403e43!important;stroke-width:0;stroke:#403e43;}#mardu-diagram-2 .arrowheadPath{fill:#0b0b0b;}#mardu-diagram-2 .edgePath .path{stroke:#403e43;stroke-width:2.0px;}#mardu-diagram-2 .flowchart-link{stroke:#403e43;fill:none;}#mardu-diagram-2 .edgeLabel{background-color:#ffffff;text-align:center;}#mardu-diagram-2 .edgeLabel p{background-color:#ffffff;}#mardu-diagram-2 .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#mardu-diagram-2 .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#mardu-diagram-2 .cluster rect{fill:hsl(180, 0%, 100%);stroke:hsl(180, 0%, 90%);stroke-width:1px;}#mardu-diagram-2 .cluster text{fill:rgb(0, 0, 0);}#mardu-diagram-2 .cluster span{color:rgb(0, 0, 0);}#mardu-diagram-2 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:system-ui,sans-serif;font-size:12px;background:hsl(180, 0%, 100%);border:1px solid hsl(180, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#mardu-diagram-2 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#121212;}#mardu-diagram-2 rect.text{fill:none;stroke-width:0;}#mardu-diagram-2 .icon-shape,#mardu-diagram-2 .image-shape{background-color:#ffffff;text-align:center