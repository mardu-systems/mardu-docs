<svg xmlns="http://www.w3.org/2000/svg" width="480" height="535" viewBox="0 0 480 535" role="img" aria-labelledby="title desc"><title id="title">Zugriffsregel und Zutrittspunkt</title><desc id="desc">Die Zugriffsregel prüft die nötigen Nachweise. Ein Zutrittspunkt verbindet Leser und optionalen Aktor mit der Ressource.</desc><rect width="480" height="100%" rx="12" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68626f" stroke-width="1.4"/></marker></defs><path d="M240 110L240 159" stroke="#68626f" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 249L240 298" stroke="#68626f" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 378L122 430" stroke="#68626f" stroke-width="2" marker-end="url(#arrow)"/><path d="M295 378L358 430" stroke="#68626f" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="20" width="390" height="90" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="51" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Geforderte Nachweise</text><text x="240.0" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">z. B. Freigabe, Buchung, Kompetenz</text><rect x="45" y="164" width="390" height="85" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Ressource: Holzwerkstatt</text><text x="240.0" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Gemeinsame Zugriffsregel</text><rect x="45" y="303" width="390" height="75" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Zutrittspunkt</text><text x="240.0" y="361" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">z. B. Eingangstür</text><rect x="20" y="435" width="205" height="72" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="122.5" y="466" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Leser</text><text x="122.5" y="490" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Identifiziert das Medium</text><rect x="255" y="435" width="205" height="72" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="357.5" y="466" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Aktor</text><text x="357.5" y="490" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Optional, je nach Regel</text></svg>