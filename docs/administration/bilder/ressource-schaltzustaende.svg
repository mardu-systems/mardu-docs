<svg xmlns="http://www.w3.org/2000/svg" width="480" height="442" viewBox="0 0 480 442" role="img" aria-labelledby="title desc"><title id="title">Drei getrennte Schaltzustände</title><desc id="desc">Angefordert beschreibt das Ziel, Ausführung den Auftrag und Gemeldet den vom Gerät berichteten Zustand.</desc><rect width="480" height="100%" rx="12" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68626f" stroke-width="1.4"/></marker></defs><rect x="35" y="22" width="410" height="92" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Angefordert</text><text x="240.0" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Welchen Zustand möchtest du setzen?</text><rect x="35" y="144" width="410" height="92" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Ausführung</text><text x="240.0" y="219" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Wie wurde der Auftrag bearbeitet?</text><rect x="35" y="266" width="410" height="92" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="297" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Gemeldet</text><text x="240.0" y="341" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Welchen Zustand meldet das Gerät?</text><text x="240" y="402" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Ein Auftrag allein bestätigt keinen Zustand.</text><text x="240" y="425" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">„Unbekannt“ bedeutet nicht „Aus“.</text></svg>