<svg xmlns="http://www.w3.org/2000/svg" width="480" height="490" viewBox="0 0 480 490" role="img" aria-labelledby="title desc"><title id="title">Lebenszyklus einer Ressource</title><desc id="desc">Ein Entwurf wird aktiviert. Eine aktive Ressource kann endgültig stillgelegt werden.</desc><rect width="480" height="100%" rx="12" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68626f" stroke-width="1.4"/></marker></defs><path d="M240 94L240 172" stroke="#68626f" stroke-width="2" marker-end="url(#arrow)"/><text x="254.0" y="139.0" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Aktivieren</text><path d="M240 247L240 325" stroke="#68626f" stroke-width="2" marker-end="url(#arrow)"/><text x="254.0" y="292.0" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Dauerhaft stilllegen</text><rect x="55" y="24" width="370" height="70" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Entwurf</text><text x="240.0" y="77" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Einrichtung vorbereiten</text><rect x="55" y="177" width="370" height="70" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Aktiv</text><text x="240.0" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Buchbarkeit und Zutritt getrennt einrichten</text><rect x="55" y="330" width="370" height="75" rx="8" fill="#faf8fd" stroke="#bba9d1" stroke-width="1.5"/><text x="240.0" y="361" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#28183d">Außer Betrieb genommen</text><text x="240.0" y="388" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Keine erneute Aktivierung</text><text x="240" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Vorübergehende Unterbrechung:</text><text x="240" y="473" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#48434e">Ressourcensperre verwenden.</text></svg>